[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix_eqtl_pipeline"
version = "0.1.0"
description = "A pipeline for eQTL analysis using MatrixEQTL, PLINK, and PEER."
authors = [
  { name="Zhang Yifan", email="your.email@example.com" },
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "rpy2",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/matrix_eqtl_pipeline"

[tool.setuptools.packages.find]
where = ["src"]
